name: Overt
description: 'OverT Bio is a clinical-stage biotechnology company developing next-generation,
  programmed off-the-shelf (allogeneic) cell therapies and biologics for solid tumors.
  The company pairs AI-powered genome-scale genetic discovery with tumor-targeting
  receptor engineering and naturally tumor-homing gamma delta T cells, plus scalable
  manufacturing intended to reduce treatment time and cost. Its pipeline includes OVT-101,
  a CLDN6-targeted CAR-T for ovarian cancer (first-in-human anticipated H1 2027), and
  OVT-201, a non-MHC T cell engager for solid tumors. Based in New York City and backed
  by Wing Venture Capital. As a therapeutics company, OverT Bio publishes no public API,
  developer portal, SDKs, or machine-readable specifications.'
